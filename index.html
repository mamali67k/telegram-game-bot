<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini App Demo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      padding: 40px;
    }
    button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🎮 Mini App تست</h2>
  <p>سلام <span id="username"></span>!</p>
  <button id="btn">ارسال پیام به ربات</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // باز شدن تمام صفحه در تلگرام

    document.getElementById("username").innerText = tg.initDataUnsafe?.user?.first_name || "کاربر";

    document.getElementById("btn").addEventListener("click", () => {
      tg.sendData("clicked_button");
    });
  </script>
</body>
</html>
